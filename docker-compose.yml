
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: heart-disease-backend

    ports:
      - "8000:8000"

    environment:
      PORT: 8000

    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: heart-disease-frontend

    ports:
      - "5173:80"

    depends_on:
      backend:
        condition: service_healthy

    restart: unless-stopped
